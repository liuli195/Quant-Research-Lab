name: PR Flow toolchain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-flow-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          git clone --no-checkout https://github.com/liuli195/my-agent-skills $RUNNER_TEMP/myspec
          git -C $RUNNER_TEMP/myspec checkout --detach 9541662a23d634734bf72ec68f7a1a0ee3ef4568
          tarball=$(python $RUNNER_TEMP/myspec/plugins/tool-lifecycle/pack.py myspec $RUNNER_TEMP)
          npm install --global --ignore-scripts --no-audit --no-fund "$tarball"
      - run: |
          git clone --no-checkout https://github.com/liuli195/my-agent-skills $RUNNER_TEMP/build-and-verify
          git -C $RUNNER_TEMP/build-and-verify checkout --detach 9541662a23d634734bf72ec68f7a1a0ee3ef4568
          tarball=$(python $RUNNER_TEMP/build-and-verify/plugins/tool-lifecycle/pack.py build-and-verify $RUNNER_TEMP)
          npm install --global --ignore-scripts --no-audit --no-fund "$tarball"
      - run: myspec doctor --all
      - run: build-and-verify verify --project .
