name: Full Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verify:
    name: Full Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure Windows test environment
        shell: pwsh
        run: |
          tzutil.exe /s "China Standard Time"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Install Build and Verify
        shell: pwsh
        run: |
          $toolchain = Get-Content .pr-flow/toolchain.json | ConvertFrom-Json
          $buildAndVerify = $toolchain.tools.'build-and-verify'
          npm install --global --ignore-scripts --no-audit --no-fund "$($buildAndVerify.packageName)@$($buildAndVerify.packageVersion)"

      - name: Run full verification
        shell: pwsh
        run: build-and-verify verify --project . --full
