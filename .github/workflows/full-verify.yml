name: Full Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verify:
    name: Full Verify
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure Windows test environment
        shell: pwsh
        run: |
          tzutil.exe /s "China Standard Time"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Install Build and Verify
        shell: pwsh
        run: |
          $toolchain = Get-Content .pr-flow/toolchain.json | ConvertFrom-Json
          $buildAndVerify = $toolchain.tools.'build-and-verify'
          if ($buildAndVerify.mode -eq "dev") {
            $source = Join-Path $env:RUNNER_TEMP "build-and-verify"
            git clone --no-checkout $buildAndVerify.sourceRepository $source
            git -C $source checkout --detach $buildAndVerify.sourceCommit
            $tarball = & .\.venv\Scripts\python.exe "$source\plugins\tool-lifecycle\pack.py" build-and-verify $env:RUNNER_TEMP
            npm install --global --ignore-scripts --no-audit --no-fund "$tarball"
          } elseif ($buildAndVerify.mode -eq "release") {
            npm install --global --ignore-scripts --no-audit --no-fund "$($buildAndVerify.packageName)@$($buildAndVerify.packageVersion)"
          } else {
            throw "Unsupported build-and-verify toolchain mode: $($buildAndVerify.mode)"
          }

      - name: Run full verification
        shell: pwsh
        run: build-and-verify verify --project . --full
